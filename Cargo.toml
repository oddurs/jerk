[package]
name = "jerk"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A terminal dashboard for the health, momentum, and completeness of your projects"
readme = "README.md"
repository = "https://github.com/oddurs/jerk"
keywords = ["tui", "git", "github", "dashboard", "project-management"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
